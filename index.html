 g.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t)return;cd={t,x:e.clientX,y:e.clientY,on:0};
  cd.tm=setTimeout(()=>{cd.on=1;const c=t.cloneNode(true);c.className='tile gh';c.style.cssText=`position:fixed;width:${t.offsetWidth}px;left:${e.clientX-t.offsetWidth/2}px;top:${e.clientY-t.offsetHeight/2}px;pointer-events:none;z-index:70`;document.body.appendChild(c);cd.c=c;t.style.opacity=.3;if(navigator.vibrate)navigator.vibrate(15)},300)});
 g.addEventListener('touchmove',e=>{if(cd&&cd.on)e.preventDefault()},{passive:false})}
addEventListener('pointermove',e=>{if(!cd)return;if(!cd.on){if(Math.hypot(e.clientX-cd.x,e.clientY-cd.y)>8){clearTimeout(cd.tm);cd=null}return}
 cd.c.style.left=e.clientX-cd.c.offsetWidth/2+'px';cd.c.style.top=e.clientY-cd.c.offsetHeight/2+'px';
 const o=document.elementFromPoint(e.clientX,e.clientY),h=o&&o.closest&&o.closest('.tile[data-u]');document.querySelectorAll('.tile.ov').forEach(z=>z.classList.remove('ov'));if(h&&h!==cd.t)h.classList.add('ov')});
const endCd=e=>{if(!cd)return;clearTimeout(cd.tm);if(cd.on){dgT=Date.now();cd.c.remove();const o=document.elementFromPoint(e.clientX,e.clientY),h=o&&o.closest&&o.closest('.tile[data-u]');
 if(h&&h!==cd.t){const a=S.own.findIndex(z=>z.uid==cd.t.dataset.u),b=S.own.findIndex(z=>z.uid==h.dataset.u);if(a>=0&&b>=0){const m=S.own.splice(a,1)[0];S.own.splice(b,0,m);save()}}render()}cd=null};
addEventListener('pointerup',endCd);addEventListener('pointercancel',endCd);

function rng(a){return()=>(a=(a*1664525+1013904223)>>>0)/4294967296}
function place(list,W,H,mine){const pts=[],cx=W/2,cy=H/2;list.forEach(o=>{const r=rng(o.uid*7919+13),sz=48+Math.floor(r()*18);let p=null;
 for(let t=0;t<80&&!p;t++){const x=sz/2+8+r()*(W-sz-16),y=sz/2+8+r()*(H-sz-16);if(Math.hypot(x-cx,y-cy)<54+sz/2+10)continue;if(pts.some(q=>Math.hypot(x-q.x,y-q.y)<(sz+q.s)/2+4))continue;p={x,y,s:sz}}
 if(!p)p={x:sz/2+8+r()*(W-sz-16),y:sz/2+8+r()*(H-sz-16),s:sz};const sp=mine&&S.pos[o.uid];if(sp){p.x=sp[0]*W;p.y=sp[1]*H}p.o=o;p.r=r;pts.push(p)});return pts}
function buy(i){const x=NF[i];if(x.lim&&!S.stock[i])return toast('Лимит закончился');if(S.st<x.p)return toast('Не хватает ⭐');
 S.st-=x.p;if(x.lim)S.stock[i]--;const c=roll(),u=++S.uid;S.own.push({uid:u,id:i,c});save();updBal();rollAnim(x,c,0,u)}
function rollAnim(x,c,cs,u){
 sheet(`<div class="pv" id="pv"><img id="pi" src="${x.img}"></div><div class="val" id="rt" style="font-size:20px;margin:6px 0 12px">${cs?'Открываем кейс…':'Выпадает цвет фона…'}</div><div class="row" id="rb" style="visibility:hidden"><button class="btn go" onclick="closeSh();go('p',1)">В профиль</button><button class="btn" onclick="sellN(${u})">Продать ⭐ ${f(Math.round(x.p*CL[c].m))}</button></div>`,1);
 const ks=['b','g','k','y'],q=[];for(let i=0;i<15;i++)q.push(cs?NF[Math.floor(Math.random()*NF.length)]:ks[Math.floor(Math.random()*4)]);q.push(cs?x:c);
 if(cs)$('#pv').style.background=CL[c].bg;
 let n=0;(function st(){const k=q[n];if(cs)$('#pi').src=k.img;else $('#pv').style.background=CL[k].bg;
  if(n<q.length-1){n++;setTimeout(st,60+n*n*2)}else{shLock=0;$('#rt').innerHTML=`${cs?x.n+' · ':''}${CL[c].n} фон: ${CL[c].t}<div class="mut" style="font-size:15px">Цена NFT ⭐ ${f(Math.round(x.p*CL[c].m))}</div>`;$('#rb').style.visibility='visible'}})();
}
function openN(u){const o=S.own.find(z=>z.uid==u);if(!o)return;const x=NF[o.id],v=val(o);
 sheet(`<div class="pv" style="background:${CL[o.c].bg}"><img src="${x.img}"></div><b style="font-size:20px">${x.n}</b>${x.lim?' <span class="mut">· лимитированный</span>':''}<div class="mut" style="margin:4px 0 12px">Фон: <b style="color:var(--tx)">${CL[o.c].n}</b> (${CL[o.c].t})<br>Цена ⭐ ${f(v)} · базовая ⭐ ${f(x.p)}</div><div class="row"><button class="btn" onclick="closeSh()">Закрыть</button><button class="btn" onclick="giftSheet('',${u})">🎁 Подарить</button></div><button class="btn go" style="width:100%;margin-top:8px" onclick="sellN(${u})">Продать за ⭐ ${f(v)}</button>`)}
function sellN(u){const i=S.own.findIndex(z=>z.uid==u);if(i<0)return;const o=S.own[i],x=NF[o.id],v=val(o);S.own.splice(i,1);S.st+=v;if(x.lim)S.stock[o.id]=(S.stock[o.id]||0)+1;save();closeSh();render();toast('Продано +⭐ '+f(v))}
function spin(ch){
 if(spinning)return;const a=takeBet();if(!a)return;spinning=true;
 let o=pk();if(boosted()&&o!=ch&&Math.random()<.4)o=pk();const rg=[[0,180],[180,270],[270,306],[306,360]][o],ang=rg[0]+4+Math.random()*(rg[1]-rg[0]-8);
 rot=rot-rot%360+360*6+(360-ang);$('#wh').style.transform=`rotate(${rot}deg)`;
 setTimeout(()=>{spinning=false;const m=[1.25,2,5][ch];
  if(o==ch){S[bc]+=a*m;toast('Победа! +'+f(a*m)+' '+KM[bc].s)}else toast('Проигрыш −'+f(a)+' '+KM[bc].s);
  save();updBal();render()},4200)}
function startChart(){const a=takeBet();if(!a)return;cg={on:1,bet:a,cur:bc,m:1,h:[1]};render();cg.id=setInterval(tick,250)}
const upv=()=>.49;
function tick(){
 cg.m+=(Math.random()-upv())*.16;cg.h.push(Math.max(cg.m,0));if(cg.h.length>90)cg.h.shift();
 if(cg.m<=0.01){clearInterval(cg.id);cg.on=0;toast('График упал до нуля, ставка сгорела');if(tab=='c')render();return}
 chartDraw()}

function chartDraw(){
 const cv=$('#cv');if(!cv||!cg.on)return;const h=cg.h,m=cg.m,col=m>=1?'#32d583':'#ff5560';
 $('#cv2').innerHTML=`<span style="color:${col}">${f(cg.bet*m)} ${KM[cg.cur].s}</span><div class="mut" style="font-size:14px">×${m.toFixed(2)}</div>`;
 const d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*d;cv.height=H*d;const x=cv.getContext('2d');x.scale(d,d);
 const mn=Math.min(...h,.9),mx=Math.max(...h,1.1),sy=v=>H-8-(v-mn)/(mx-mn)*(H-16),sx=i=>i/Math.max(h.length-1,1)*W;
 x.strokeStyle='rgba(255,255,255,.35)';x.setLineDash([5,5]);x.beginPath();x.moveTo(0,sy(1));x.lineTo(W,sy(1));x.stroke();x.setLineDash([]);
 x.beginPath();h.forEach((v,i)=>i?x.lineTo(sx(i),sy(v)):x.moveTo(sx(i),sy(v)));x.strokeStyle=col;x.lineWidth=3;x.lineJoin='round';x.stroke();
 x.lineTo(sx(h.length-1),H);x.lineTo(0,H);x.closePath();x.globalAlpha=.14;x.fillStyle=col;x.fill();x.globalAlpha=1;
}
