function rng(a){return()=>(a=(a*1664525+1013904223)>>>0)/4294967296}

function tick(){
 cg.m+=(Math.random()-upv())*.16;cg.h.push(Math.max(cg.m,0));if(cg.h.length>90)cg.h.shift();
 if(cg.m<=0.01){clearInterval(cg.id);cg.on=0;toast('График упал до нуля, ставка сгорела');if(tab=='c')render();return}
 chartDraw()}
function cash(){clearInterval(cg.id);const w=cg.bet*cg.m;S[cg.cur]+=w;cg.on=0;save();updBal();toast('Забрано '+f(w)+' '+KM[cg.cur].s);render()}
function chartDraw(){
 const cv=$('#cv');if(!cv||!cg.on)return;const h=cg.h,m=cg.m,col=m>=1?'#32d583':'#ff5560';
 $('#cv2').innerHTML=`<span style="color:${col}">${f(cg.bet*m)} ${KM[cg.cur].s}</span><div class="mut" style="font-size:14px">×${m.toFixed(2)}</div>`;
 const d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*d;cv.height=H*d;const x=cv.getContext('2d');x.scale(d,d);
 const mn=Math.min(...h,.9),mx=Math.max(...h,1.1),sy=v=>H-8-(v-mn)/(mx-mn)*(H-16),sx=i=>i/Math.max(h.length-1,1)*W;
 x.strokeStyle='rgba(255,255,255,.35)';x.setLineDash([5,5]);x.beginPath();x.moveTo(0,sy(1));x.lineTo(W,sy(1));x.stroke();x.setLineDash([]);
 x.beginPath();h.forEach((v,i)=>i?x.lineTo(sx(i),sy(v)):x.moveTo(sx(i),sy(v)));x.strokeStyle=col;x.lineWidth=3;x.lineJoin='round';x.stroke();
 x.lineTo(sx(h.length-1),H);x.lineTo(0,H);x.closePath();x.globalAlpha=.14;x.fillStyle=col;x.fill();x.globalAlpha=1;
}
let shLock=0;
function sheet(h,l){shLock=l?1:0;$('#shb').innerHTML=h;$('#sh').classList.add('on')}
function closeSh(){if(shLock)return;$('#sh').classList.remove('on')}
function openAva(){sheet(`<b>Выбери аватар</b><div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:12px">${AV.map(a=>`<button class="chip" style="font-size:30px;padding:10px 0" onclick="S.ava='${a}';save();closeSh();render()">${a}</button>`).join('')}</div>`)}
let ex={a:'st',b:'usd'};
function openEx(){
 const row=(w)=>`<div class="chips">${K.map(c=>`<button class="chip ${ex[w]==c.k?'on':''}" onclick="ex.${w}='${c.k}';openEx()">${c.s}</button>`).join('')}</div>`;
 sheet(`<b>Обмен</b><div class="mut" style="margin-top:4px">1 $ = 25 ⭐ · 1 ₿ = 60 ⭐ · 1 Z = 15 ⭐</div><div class="mut" style="margin-top:10px">Отдаёшь</div>${row('a')}<input id="exa" type="number" inputmode="decimal" placeholder="Сумма" oninput="exPrev()"><div class="mut" style="margin-top:10px">Получаешь</div>${row('b')}<div class="val" id="exo" style="font-size:26px;margin:8px 0">0</div><button class="btn go" style="width:100%" onclick="doEx()">Обменять</button>`)}
let ac='st';
function admBlock(){
 if(!S.adm)return `<button class="btn" style="width:100%;margin-top:14px" onclick="admAsk()">🔑 Включить режим автора</button>`;
 return `<div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)"><b>Режим автора</b><div class="chips">${K.map(c=>`<button class="chip ${ac==c.k?'on':''}" onclick="ac='${c.k}';openEx()">${c.s}</button>`).join('')}</div><input id="adA" type="number" inputmode="decimal" placeholder="Сколько выдать"><div class="row"><button class="btn go" onclick="admGive()">Выдать</button><button class="btn" onclick="S.adm=0;save();openEx()">Выключить</button></div><input id="adD" placeholder="Адрес сервера игроков (https://…)" value="${esc(S.dburl||'')}" style="margin-top:10px;font-size:14px"><button class="btn" style="width:100%;margin-top:8px" onclick="S.dburl=$('#adD').value.trim();save();toast('Адрес сохранён')">Сохранить адрес</button></div>`}
function admAsk(){sheet(`<b>Режим автора</b><div class="mut" style="margin:4px 0 10px">Введи пароль</div><input id="adP" type="password" placeholder="Пароль" autocomplete="off"><div class="row"><button class="btn" onclick="openEx()">Назад</button><button class="btn go" onclick="admOn()">Включить</button></div>`)}
function admOn(){if($('#adP').value==='\u0000'){S.adm=1;save();openEx();toast('Режим автора включён')}else toast('Неверный пароль')}
function admGive(){const a=parseFloat($('#adA').value);if(!(a>0)||!isFinite(a))return toast('Введи сумму');S[ac]+=a;save();updBal();toast('Выдано '+f(a)+' '+KM[ac].s)}
function exPrev(){const a=parseFloat($('#exa').value)||0;$('#exo').textContent=f(a*KM[ex.a].v/KM[ex.b].v)+' '+KM[ex.b].s}
function doEx(){const a=parseFloat($('#exa').value);if(!(a>0))return toast('Введи сумму');if(ex.a==ex.b)return toast('Выбери разные валюты');if(a>S[ex.a]+1e-9)return toast('Не хватает '+KM[ex.a].s);const o=a*KM[ex.a].v/KM[ex.b].v;S[ex.a]-=a;S[ex.b]+=o;save();closeSh();render();toast('Получено '+f(o)+' '+KM[ex.b].s)}
go('p');
const bt=()=>{const b=$('#bst'),l=S.boostUntil-Date.now();if(l>0){b.style.display='block';b.textContent='⚡ Шансы повышены · '+Math.floor(l/60000)+':'+String(Math.floor(l/1000)%60).padStart(2,'0')}else b.style.display='none';document.body.classList.toggle('disco',l>0)};
setInterval(()=>{bt();minerUp()},1000);bt();
if(!S.v3){S.v3=1;S.adm=0}
if(!S.v4){S.v4=1;S.st+=500;S.boostUntil=Date.now()+36e5;save();updBal();bt();sheet(`<div class="val">🪩</div><div class="val" style="font-size:26px;margin:6px 0">Дискотека!</div><div class="val" style="font-size:22px;color:var(--gold)">+500 ⭐</div><div class="mut" style="text-align:center;margin:8px 0 12px">Первый час после обновления у всех: выше шансы на рынке, в колесе, кейсах, фонах NFT и шахте.</div><button class="btn go" style="width:100%" onclick="closeSh()">Танцуем!</button>`)}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
